<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub - Admin</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="header">
        <h1 class="logo">StyleHub Admin</h1>
        <nav class="menu">
            <a href="index.html">Ver tienda</a>
            <a href="#" id="btn-cerrar-sesion-admin">Cerrar sesión</a>
        </nav>
    </header>

    <main class="admin-container">

        <section class="admin-form-box">
            <h2 id="titulo-form">Agregar producto</h2>
            <form id="formulario-producto">
                <input type="hidden" id="producto-id">

                <label for="p-nombre">Nombre:</label>
                <input type="text" id="p-nombre" required>

                <label for="p-precio">Precio (S/):</label>
                <input type="number" id="p-precio" step="0.01" required>

                <label for="p-talla">Talla:</label>
                <input type="text" id="p-talla" required>

                <label for="p-categoria">Categoría:</label>
                <input type="text" id="p-categoria" required>

                <label for="p-stock">Stock:</label>
                <input type="number" id="p-stock" required>

                <label for="p-imagen">URL de imagen:</label>
                <input type="text" id="p-imagen" required>

                <p id="error-producto" class="mensaje-error"></p>

                <button type="submit" id="btn-guardar">Agregar producto</button>
                <button type="button" id="btn-cancelar" style="display:none;">Cancelar edición</button>
            </form>
        </section>

        <section class="admin-tabla-box">
            <h2>Productos existentes</h2>
            <table id="tabla-productos" class="tabla-admin">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Talla</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-productos"></tbody>
            </table>
        </section>

        <section class="admin-tabla-box">
            <h2>Pedidos realizados</h2>
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-pedidos"></tbody>
            </table>
        </section>

    </main>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
