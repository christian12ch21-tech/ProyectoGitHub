<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-3">Iniciar sesión</h1>
    <form [formGroup]="form" (ngSubmit)="entrar()" novalidate class="card card-body">
      <div class="mb-3">
        <label for="email" class="form-label">Correo</label>
        <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="invalido('email')" autocomplete="email" />
        <div class="invalid-feedback">Ingresa un correo válido.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" type="password" class="form-control" formControlName="password" [class.is-invalid]="invalido('password')" autocomplete="current-password" />
        <div class="invalid-feedback">Mínimo 6 caracteres.</div>
      </div>
      @if (error()) {
        <p role="alert" class="text-danger">{{ error() }}</p>
      }
      <button type="submit" class="btn btn-sh" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
      <p class="mt-3 mb-0">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
    </form>
  </div>
</div>
