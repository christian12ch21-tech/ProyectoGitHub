<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal académico</title>
<style>
  :root { --azul:#172e4d; --fondo:#f4f6f9; --borde:#d7dee8; --acento:#1d5fb4; --error:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--fondo); color:var(--azul); line-height:1.5; }
  header { background:var(--azul); color:#fff; padding:1.2rem 1rem; }
  .wrap { max-width:960px; margin:0 auto; padding:0 1rem; }
  header p { font-size:1.4rem; margin:0 0 .8rem; }
  nav { display:flex; flex-wrap:wrap; gap:.5rem; }
  nav a { color:#fff; padding:.5rem .8rem; border-radius:.4rem; text-decoration:none; }
  nav a.activo { background:#fff; color:var(--azul); font-weight:700; }
  main { padding:1.5rem 1rem; } footer { padding:0 1rem 1.5rem; color:#5b6b80; }
  .saltar { position:absolute; top:-5rem; left:1rem; background:#fff; padding:.8rem; z-index:10; }
  .saltar:focus { top:.5rem; }
  .panel { background:#fff; padding:1.5rem; border:1px solid var(--borde); border-radius:.8rem; }
  .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); margin:1rem 0; }
  .grande { font-size:2.4rem; margin:.3rem 0 0; }
  .card { background:#fff; border:2px solid var(--borde); border-radius:.8rem; padding:1.2rem; }
  .card.sel { border-color:var(--acento); }
  .card h2 { font-size:1.2rem; margin:0; } .card dt { font-weight:700; } .card dd { margin:0 0 .4rem; }
  .btn { display:inline-block; background:var(--acento); color:#fff; border:2px solid var(--acento); border-radius:.4rem; padding:.5rem 1rem; font:inherit; text-decoration:none; cursor:pointer; }
  .btn.sec { background:#fff; color:var(--acento); }
  form { max-width:42rem; }
  label { display:block; font-weight:600; margin-bottom:.25rem; }
  input, select { width:100%; padding:.5rem; font:inherit; border:1px solid #8a97a8; border-radius:.4rem; }
  input.mal, select.mal { border-color:var(--error); }
  .campo { margin-bottom:1rem; } .ayuda { color:#5b6b80; font-size:.9rem; margin:.2rem 0 0; }
  .err { color:var(--error); margin:.2rem 0 0; min-height:1.4rem; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #8b4e00; outline-offset:3px; }
  .acciones { display:flex; flex-wrap:wrap; gap:.5rem; }
</style>
</head>
<body>
<a href="#contenido" class="saltar">Saltar al contenido</a>
<header><div class="wrap">
  <p>Portal académico</p>
  <nav aria-label="Navegación principal">
    <a href="#/resumen" data-ruta="resumen">Resumen</a>
    <a href="#/estudiantes" data-ruta="estudiantes">Estudiantes</a>
    <a href="#/registro" data-ruta="registro">Registro</a>
  </nav>
</div></header>
<main id="contenido" tabindex="-1" class="wrap"></main>
<footer class="wrap">Laboratorio con datos ficticios, sin conexión a un servidor.</footer>

<script>
'use strict';
/* ---------- Modelo y estado compartido (en memoria) ---------- */
const estadoAcademico = (p) => p >= 14 ? 'Destacado' : p >= 11 ? 'Aprobado' : 'En riesgo';

const store = {
  lista: [
    { id:101, nombre:'Ana Torres',    programa:'Software', promedio:17.2, asistencia:94 },
    { id:102, nombre:'Luis Ramírez',  programa:'Sistemas', promedio:10.4, asistencia:72 },
    { id:103, nombre:'María Paredes', programa:'Software', promedio:13.5, asistencia:88 },
    { id:104, nombre:'Carlos Vega',   programa:'Sistemas', promedio:8.9,  asistencia:66 },
    { id:105, nombre:'Sofía Medina',  programa:'Software', promedio:18.1, asistencia:97 },
    { id:106, nombre:'Diego Salas',   programa:'Sistemas', promedio:11.8, asistencia:81 },
  ],
  siguienteId: 107,
  total() { return this.lista.length; },
  promedio() { return this.lista.length ? this.lista.reduce((s, e) => s + e.promedio, 0) / this.lista.length : 0; },
  agregar(d) {
    const nombre = d.nombre.trim();
    if (nombre.length < 3 || nombre.length > 80 || !['Software','Sistemas'].includes(d.programa) ||
        !Number.isFinite(d.promedio) || d.promedio < 0 || d.promedio > 20 ||
        !Number.isFinite(d.asistencia) || d.asistencia < 0 || d.asistencia > 100)
      throw new Error('Los datos del estudiante no son válidos.');
    const e = { ...d, nombre, id: this.siguienteId++ };
    this.lista = [...this.lista, e];
    return e;
  },
};

/* ---------- Formato (equivale a los pipes) ---------- */
const num = new Intl.NumberFormat('es-PE', { minimumFractionDigits:2, maximumFractionDigits:2 });
const pct = new Intl.NumberFormat('es-PE', { style:'percent', maximumFractionDigits:0 });
const fechaHoy = new Intl.DateTimeFormat('es-PE', { day:'2-digit', month:'2-digit', year:'numeric' }).format(new Date());
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Vistas ---------- */
const main = document.getElementById('contenido');
let seleccionado = null;

function vistaResumen() {
  document.title = 'Resumen académico';
  main.innerHTML = `
    <h1>Resumen académico</h1>
    <p>Consulta local del ${fechaHoy}.</p>
    <div class="grid">
      <section class="panel" aria-labelledby="t1"><h2 id="t1">Estudiantes registrados</h2><p class="grande">${store.total()}</p></section>
      <section class="panel" aria-labelledby="t2"><h2 id="t2">Promedio general</h2><p class="grande">${num.format(store.promedio())}</p></section>
    </div>
    <p>Los registros se conservan al navegar y se reinician al recargar.</p>
    <a class="btn" href="#/estudiantes">Consultar estudiantes</a>`;
}

function vistaEstudiantes() {
  document.title = 'Estudiantes';
  const tarjetas = store.lista.map((e) => `
    <article class="card ${seleccionado?.id === e.id ? 'sel' : ''}">
      <h2>${esc(e.nombre)}</h2>
      <p>${e.programa}</p>
      <dl>
        <dt>Promedio</dt><dd>${num.format(e.promedio)}</dd>
        <dt>Asistencia</dt><dd>${pct.format(e.asistencia / 100)}</dd>
        <dt>Estado académico</dt><dd>${estadoAcademico(e.promedio)}</dd>
      </dl>
      <button type="button" class="btn sec" data-id="${e.id}" aria-pressed="${seleccionado?.id === e.id}"
        aria-label="Seleccionar a ${esc(e.nombre)}">${seleccionado?.id === e.id ? 'Seleccionado' : 'Seleccionar'}</button>
    </article>`).join('');
  main.innerHTML = `
    <h1>Estudiantes</h1>
    <p>Selecciona una tarjeta para ver su identificador.</p>
    <a class="btn" href="#/registro">Registrar estudiante</a>
    <p role="status" aria-live="polite" id="estado-sel">${seleccionado
      ? `Estudiante seleccionado ${esc(seleccionado.nombre)} con identificador ${seleccionado.id}.`
      : 'No hay una selección activa.'}</p>
    <div class="grid">${tarjetas || '<p>No hay estudiantes registrados.</p>'}</div>`;
  main.querySelectorAll('button[data-id]').forEach((b) => b.addEventListener('click', () => {
    seleccionado = store.lista.find((e) => e.id === Number(b.dataset.id)) ?? null;
    vistaEstudiantes();
    main.querySelector(`button[data-id="${seleccionado.id}"]`).focus();
  }));
}

function vistaRegistro() {
  document.title = 'Registrar estudiante';
  main.innerHTML = `
    <h1>Registrar estudiante</h1>
    <p>Completa los cuatro campos. El registro se guarda solo en memoria.</p>
    <form class="panel" id="form" novalidate>
      <div class="campo"><label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" autocomplete="name" aria-describedby="nombre-ayuda nombre-error">
        <p id="nombre-ayuda" class="ayuda">Entre 3 y 80 caracteres después de quitar espacios exteriores.</p>
        <p id="nombre-error" class="err"></p></div>
      <div class="campo"><label for="programa">Programa</label>
        <select id="programa"><option value="Software">Ingeniería de Software</option><option value="Sistemas">Ingeniería de Sistemas</option></select></div>
      <div class="campo"><label for="promedio">Promedio de 0 a 20</label>
        <input id="promedio" type="number" min="0" max="20" step="any" aria-describedby="promedio-error">
        <p id="promedio-error" class="err"></p></div>
      <div class="campo"><label for="asistencia">Asistencia de 0 a 100 por ciento</label>
        <input id="asistencia" type="number" min="0" max="100" step="any" aria-describedby="asistencia-error">
        <p id="asistencia-error" class="err"></p></div>
      <p role="alert" class="err" id="alerta"></p>
      <div class="acciones"><button type="submit" class="btn">Guardar estudiante</button>
        <a class="btn sec" href="#/estudiantes">Ver estudiantes</a></div>
    </form>
    <p role="status" aria-live="polite" id="mensaje"></p>`;

  const $ = (id) => document.getElementById(id);
  // Un campo vacío es null; el cero es un valor válido.
  const leer = (id) => $(id).value.trim() === '' ? null : Number($(id).value);
  const reglas = {
    nombre:     () => { const t = $('nombre').value.trim(); return t.length >= 3 && t.length <= 80; },
    promedio:   () => { const v = leer('promedio');   return v !== null && Number.isFinite(v) && v >= 0 && v <= 20; },
    asistencia: () => { const v = leer('asistencia'); return v !== null && Number.isFinite(v) && v >= 0 && v <= 100; },
  };
  const textos = {
    nombre: 'Escribe un nombre de 3 a 80 caracteres.',
    promedio: 'Ingresa un número entre 0 y 20.',
    asistencia: 'Ingresa un número entre 0 y 100.',
  };
  function validar() {
    let ok = true;
    for (const campo of Object.keys(reglas)) {
      const bien = reglas[campo]();
      $(campo).classList.toggle('mal', !bien);
      $(campo).setAttribute('aria-invalid', String(!bien));
      $(campo + '-error').textContent = bien ? '' : textos[campo];
      ok = ok && bien;
    }
    return ok;
  }
  $('form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    $('mensaje').textContent = '';
    if (!validar()) { $('alerta').textContent = 'Revisa los campos señalados antes de guardar.'; return; }
    $('alerta').textContent = '';
    try {
      const nuevo = store.agregar({ nombre:$('nombre').value, programa:$('programa').value,
                                    promedio:leer('promedio'), asistencia:leer('asistencia') });
      $('form').reset();
      $('mensaje').textContent = `Se registró a ${nuevo.nombre} con identificador ${nuevo.id}.`;
      ['nombre','promedio','asistencia'].forEach((c) => { $(c).classList.remove('mal'); $(c).removeAttribute('aria-invalid'); });
    } catch (e) { $('mensaje').textContent = e.message; }
  });
}

function vistaNoEncontrada() {
  document.title = 'Página no encontrada';
  main.innerHTML = `<h1>Página no encontrada</h1>
    <p>La dirección solicitada no corresponde a una vista del portal.</p>
    <a class="btn" href="#/resumen">Volver al resumen</a>`;
}

/* ---------- Router por hash (#/ruta) ---------- */
const rutas = { resumen: vistaResumen, estudiantes: vistaEstudiantes, registro: vistaRegistro };
function navegar() {
  const ruta = location.hash.replace(/^#\/?/, '');
  if (ruta === '') { location.replace('#/resumen'); return; }   // redirección inicial
  (rutas[ruta] ?? vistaNoEncontrada)();
  document.querySelectorAll('nav a').forEach((a) => {
    const activa = a.dataset.ruta === ruta;
    a.classList.toggle('activo', activa);
    activa ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
}
window.addEventListener('hashchange', navegar);
navegar();
</script>
</body>
</html>
