<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-3">Crear cuenta</h1>
    <form [formGroup]="form" (ngSubmit)="crear()" novalidate class="card card-body">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input id="nombre" class="form-control" formControlName="nombre" [class.is-invalid]="invalido('nombre')" autocomplete="name" />
        <div class="invalid-feedback">Mínimo 3 caracteres.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo</label>
        <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="invalido('email')" autocomplete="email" />
        <div class="invalid-feedback">Ingresa un correo válido.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" type="password" class="form-control" formControlName="password" [class.is-invalid]="invalido('password')" autocomplete="new-password" />
        <div class="invalid-feedback">Mínimo 6 caracteres.</div>
      </div>
      <div class="mb-3">
        <label for="confirmar" class="form-label">Confirmar contraseña</label>
        <input id="confirmar" type="password" class="form-control" formControlName="confirmar" [class.is-invalid]="invalido('confirmar') || (form.touched && form.hasError('noCoinciden'))" autocomplete="new-password" />
        <div class="invalid-feedback">Las contraseñas deben coincidir.</div>
      </div>
      @if (error()) {
        <p role="alert" class="text-danger">{{ error() }}</p>
      }
      <button type="submit" class="btn btn-sh" [disabled]="enviando()">
        {{ enviando() ? 'Creando...' : 'Crear cuenta' }}
      </button>
      <p class="mt-3 mb-0">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </form>
  </div>
</div>
